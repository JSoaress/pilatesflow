# Sobreposição de desenvolvimento: troca a aplicação por `next dev` com hot reload.
#   make dev
#   docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  app:
    image: pilatesflow-app-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "yarn install --frozen-lockfile && yarn dev -p 3001 -H 0.0.0.0"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # binários nativos do host (macOS/Windows) não servem no Alpine
      - app-node-modules:/app/node_modules
      - app-next:/app/.next

volumes:
  app-node-modules:
  app-next:
