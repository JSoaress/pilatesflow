# PilatesFlow — stack completa (aplicação + Supabase self-hosted).
# Sempre com --env-file .env.docker (ou use o Makefile):
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up -d --build
# Detalhes em docs/docker.md.
name: pilatesflow

x-supabase-image: &pg-image supabase/postgres:17.6.1.136

x-app-env: &app-env
  NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL:-http://localhost:3000}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?defina ANON_KEY no .env.docker}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  NEXT_PUBLIC_DEFAULT_ORG_SLUG: ${NEXT_PUBLIC_DEFAULT_ORG_SLUG:-studio-movimento}
  NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PilatesFlow}
  NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-}
  NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?defina SERVICE_ROLE_KEY no .env.docker}
  ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-true}
  CRON_SECRET: ${CRON_SECRET:?defina CRON_SECRET no .env.docker}
  TZ: ${TZ:-America/Sao_Paulo}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  ASAAS_API_KEY: ${ASAAS_API_KEY:-}
  ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}
  ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
  MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  NFSE_PROVIDER: ${NFSE_PROVIDER:-}
  NFSE_API_KEY: ${NFSE_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  # ---------------------------------------------------------------- banco
  db:
    image: *pg-image
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env.docker}
      JWT_EXP: ${JWT_EXPIRY:-3600}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Roles, senhas, schemas e funções auth.* que o Supabase espera; sai ao terminar.
  db-init:
    image: *pg-image
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/docker/db/init/01-roles-and-jwt.sh"]
    environment:
      PGHOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
    volumes:
      - ./docker:/docker:ro

  # ---------------------------------------------------------------- supabase
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:3000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:-http://localhost:3000}/**,${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}/**
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@localhost}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-localhost}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${NEXT_PUBLIC_APP_NAME:-PilatesFlow}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}

  storage:
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: pilatesflow
      REGION: local
      GLOBAL_S3_BUCKET: pilatesflow
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  # Aplica supabase/migrations/*.sql (depois que auth e storage criaram seus schemas); sai ao terminar.
  migrate:
    image: *pg-image
    restart: "no"
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      rest:
        condition: service_started
    entrypoint: ["/bin/sh", "/docker/migrate.sh"]
    environment:
      PGHOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker:/docker:ro
      - ./supabase/migrations:/migrations:ro

  # ---------------------------------------------------------------- entrada única
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-3000}:${PUBLIC_PORT:-3000}"
    environment:
      PUBLIC_PORT: ${PUBLIC_PORT:-3000}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  # ---------------------------------------------------------------- aplicação
  # Compartilha a rede do gateway: http://localhost:PUBLIC_PORT vale igual dentro e fora do Docker.
  # Escuta em 3001 e não publica portas (quem publica é o gateway).
  app:
    image: pilatesflow-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_ORG_SLUG: ${NEXT_PUBLIC_DEFAULT_ORG_SLUG:-studio-movimento}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PilatesFlow}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    restart: unless-stopped
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env

  # ---------------------------------------------------------------- perfis opcionais
  # docker compose --env-file .env.docker --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    image: pilatesflow-app-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    depends_on:
      gateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "seed"]
    environment:
      <<: *app-env
      # O seed fala com o gateway pela rede do Compose.
      NEXT_PUBLIC_SUPABASE_URL: http://gateway:${PUBLIC_PORT:-3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@12345}

  # docker compose --env-file .env.docker --profile cron up -d cron
  cron:
    profiles: ["cron"]
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      CRON_BASE_URL: http://gateway:${PUBLIC_PORT:-3000}
      CRON_SECRET: ${CRON_SECRET}
      CRON_MESSAGES_MINUTES: ${CRON_MESSAGES_MINUTES:-10}
      CRON_DAILY_HOUR: ${CRON_DAILY_HOUR:-3}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./docker/cron/entrypoint.sh:/entrypoint.sh:ro

volumes:
  db-data:
  storage-data:
